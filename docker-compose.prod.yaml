# Production docker-compose for NAS deployment
#
# Usage:
#   1. Copy .env_example to .env and fill in your values
#   2. Run: docker-compose -f docker-compose.prod.yaml up -d
#
# To update to latest version:
#   docker-compose -f docker-compose.prod.yaml pull
#   docker-compose -f docker-compose.prod.yaml up -d
#
# Note: Database schema is automatically created/migrated by the app on startup.
#       No manual database initialization required!

services:
  nudlers-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NUDLERS_DB_NAME:-nudlers}
      POSTGRES_USER: ${NUDLERS_DB_USER:-myuser}
      POSTGRES_PASSWORD: ${NUDLERS_DB_PASSWORD:?NUDLERS_DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    command: postgres -c ssl=off
    networks:
      - nudlers-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${NUDLERS_DB_USER:-myuser} -d ${NUDLERS_DB_NAME:-nudlers}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nudlers-app:
    build: ./app
    restart: unless-stopped
    # Note: No 'user:' needed - container starts as root to fix volume permissions,
    # then automatically drops to non-root 'pptruser' via gosu
    environment:
      - NUDLERS_DB_USER=${NUDLERS_DB_USER:-myuser}
      - NUDLERS_DB_HOST=nudlers-db
      - NUDLERS_DB_NAME=${NUDLERS_DB_NAME:-nudlers}
      - NUDLERS_DB_PASSWORD=${NUDLERS_DB_PASSWORD:?NUDLERS_DB_PASSWORD is required}
      - NUDLERS_DB_PORT=5432
      - NUDLERS_API_URL=http://localhost:3000/api
      # Legacy encryption key (pass through for vault migration)
      - NUDLERS_ENCRYPTION_KEY=${NUDLERS_ENCRYPTION_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - PASSKEY_ENCRYPTION_SECRET=${PASSKEY_ENCRYPTION_SECRET:-}
      - NUDLERS_VAULT_PASSPHRASE=${NUDLERS_VAULT_PASSPHRASE:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:6969}
      # Resource mode: normal | low (defaults to normal)
      - RESOURCE_MODE=${RESOURCE_MODE:-normal}
    ports:
      - "100.64.55.1:8001:3000"
    depends_on:
      nudlers-db:
        condition: service_healthy
    networks:
      - nudlers-network
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    # Reduced from 2gb - with --single-process and aggressive flags, 512mb is sufficient
    shm_size: '2gb'
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Resource limits for NAS - adjust based on your NAS specs
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - whatsapp-data:/app/.baileys_auth

volumes:
  db-data:
  whatsapp-data:


networks:
  nudlers-network:
    driver: bridge
